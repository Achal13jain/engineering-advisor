<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Engineering Advisor works</title>
  <desc id="desc">Understand the project, size the engineering safeguards to its risk and maturity, and create a phased plan.</desc>
  <rect width="1200" height="300" rx="24" fill="#f5f5f1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="52" y="58" font-size="15" font-weight="700" letter-spacing="2">A PRACTICAL ENGINEERING PLAN IN THREE STEPS</text>
    <g transform="translate(52 90)">
      <rect width="316" height="150" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="150" rx="5" fill="#5b8cff"/>
      <circle cx="48" cy="43" r="20" fill="#5b8cff"/>
      <text x="48" y="49" text-anchor="middle" font-size="16" font-weight="700">1</text>
      <text x="28" y="91" font-size="23" font-weight="700">Understand</text>
      <text x="28" y="120" font-size="15" fill="#464646">Project family, users, and release style</text>
    </g>
    <path d="M382 165h34m-10-10 10 10-10 10" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(442 90)">
      <rect width="316" height="150" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="150" rx="5" fill="#7be0a4"/>
      <circle cx="48" cy="43" r="20" fill="#7be0a4"/>
      <text x="48" y="49" text-anchor="middle" font-size="16" font-weight="700">2</text>
      <text x="28" y="91" font-size="23" font-weight="700">Size the safeguards</text>
      <text x="28" y="120" font-size="15" fill="#464646">Match risk and maturity, avoid excess</text>
    </g>
    <path d="M772 165h34m-10-10 10 10-10 10" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(832 90)">
      <rect width="316" height="150" rx="16" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <rect width="10" height="150" rx="5" fill="#ffd43b"/>
      <circle cx="48" cy="43" r="20" fill="#ffd43b"/>
      <text x="48" y="49" text-anchor="middle" font-size="16" font-weight="700">3</text>
      <text x="28" y="91" font-size="23" font-weight="700">Make a phased plan</text>
      <text x="28" y="120" font-size="15" fill="#464646">Essential now, next, and later</text>
    </g>
  </g>
</svg>
